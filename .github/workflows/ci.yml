name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: msvc,        cc: cl,    cxx: cl }
          - { os: ubuntu-latest,  name: gcc,         cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest,  name: clang,       cc: clang, cxx: clang++ }
          - { os: macos-latest,   name: apple-clang, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DKIOTTY_NET_BUILD_TESTS=ON -DKIOTTY_NET_USE_TLS=OFF
      - name: build
        run: cmake --build build --config Debug --parallel
      - name: unit and integration tests
        run: ctest --test-dir build -C Debug --output-on-failure -L "unit|integration"

  sanitizers:
    name: clang ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DKIOTTY_NET_BUILD_TESTS=ON -DKIOTTY_NET_USE_TLS=OFF "-DKIOTTY_NET_SANITIZER=${{ matrix.sanitizer }}"
      - name: build
        run: cmake --build build --parallel
      - name: unit and integration tests
        run: ctest --test-dir build --output-on-failure -L "unit|integration"

  cross-build:
    name: ${{ matrix.name }} (build only)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: android-arm64
            configure: >-
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
              -DKIOTTY_NET_BUILD_TESTS=ON
          - os: macos-latest
            name: ios-arm64
            configure: >-
              -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64
              -DKIOTTY_NET_BUILD_TESTS=OFF
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKIOTTY_NET_USE_TLS=OFF ${{ matrix.configure }}
      - name: build
        run: cmake --build build --parallel
