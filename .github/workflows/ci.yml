name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.compiler }} tls=${{ matrix.tls }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, gcc, clang, apple-clang]
        tls: ["ON", "OFF"]
        include:
          - { compiler: msvc,        os: windows-latest, cc: cl,    cxx: cl }
          - { compiler: gcc,         os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { compiler: clang,       os: ubuntu-latest,  cc: clang, cxx: clang++ }
          - { compiler: apple-clang, os: macos-latest,   cc: clang, cxx: clang++ }
        exclude:
          - { compiler: apple-clang, tls: "ON" }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DKIOTTY_NET_BUILD_TESTS=ON -DKIOTTY_NET_USE_TLS=${{ matrix.tls }}
      - name: build
        run: cmake --build build --config Debug --parallel
      - name: unit and integration tests
        run: ctest --test-dir build -C Debug --output-on-failure -L "unit|integration"

  sanitizers:
    name: clang ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DKIOTTY_NET_BUILD_TESTS=ON -DKIOTTY_NET_USE_TLS=ON "-DKIOTTY_NET_SANITIZER=${{ matrix.sanitizer }}"
      - name: build
        run: cmake --build build --parallel
      - name: unit and integration tests
        run: ctest --test-dir build --output-on-failure -L "unit|integration"

  epoll:
    name: gcc epoll only (io_uring OFF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DKIOTTY_NET_BUILD_TESTS=ON -DKIOTTY_NET_USE_TLS=ON -DKIOTTY_NET_WITH_IO_URING=OFF
      - name: build
        run: cmake --build build --parallel
      - name: unit and integration tests
        run: ctest --test-dir build --output-on-failure -L "unit|integration"

  libkqueue:
    name: gcc kqueue backend through libkqueue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build libkqueue
        run: >-
          git clone --depth 1 --branch v2.7.0 https://github.com/mheily/libkqueue.git $HOME/libkqueue &&
          cmake -S $HOME/libkqueue -B $HOME/libkqueue/build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=$HOME/.local -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTING=OFF &&
          cmake --build $HOME/libkqueue/build --parallel &&
          cmake --install $HOME/libkqueue/build
      - name: configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DKIOTTY_NET_BUILD_TESTS=ON -DKIOTTY_NET_USE_TLS=ON
          -DKIOTTY_NET_WITH_LIBKQUEUE=ON -DCMAKE_PREFIX_PATH=$HOME/.local
          -DKIOTTY_NET_LIBKQUEUE_LIBRARY=$HOME/.local/lib/libkqueue.a
      - name: build
        run: cmake --build build --parallel
      - name: unit and integration tests
        run: ctest --test-dir build --output-on-failure -L "unit|integration"

  cross-build:
    name: ${{ matrix.name }} (build only)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: android-arm64
            configure: >-
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
              -DKIOTTY_NET_BUILD_TESTS=ON -DKIOTTY_NET_USE_TLS=ON
          - os: macos-latest
            name: ios-arm64
            configure: >-
              -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64
              -DKIOTTY_NET_BUILD_TESTS=OFF -DKIOTTY_NET_USE_TLS=OFF
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug ${{ matrix.configure }}
      - name: build
        run: cmake --build build --parallel

  benchmark:
    name: benchmark
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DKIOTTY_NET_BUILD_BENCHMARKS=ON -DKIOTTY_NET_USE_TLS=ON
          cmake -B build-epoll -DCMAKE_BUILD_TYPE=Release -DKIOTTY_NET_BUILD_BENCHMARKS=ON -DKIOTTY_NET_USE_TLS=ON -DKIOTTY_NET_WITH_IO_URING=OFF
      - name: build
        run: |
          cmake --build build --parallel --target kiotty_net_benchmarks
          cmake --build build-epoll --parallel --target kiotty_net_benchmarks
      - name: run (default io_uring, then epoll only on the same runner)
        run: |
          build/tests/benchmark/kiotty_net_benchmarks --benchmark_min_time=0.5s --benchmark_out=benchmark.json --benchmark_out_format=json
          build-epoll/tests/benchmark/kiotty_net_benchmarks --benchmark_min_time=0.5s --benchmark_out=benchmark-epoll.json --benchmark_out_format=json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.sha }}
          path: |
            benchmark.json
            benchmark-epoll.json
